# SVG иконка для проекта Godot
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <circle cx="64" cy="64" r="60" fill="#1a1a2e"/>
  
  <!-- Дракон (упрощенный) -->
  <ellipse cx="64" cy="70" rx="35" ry="25" fill="#4a9c59"/>
  <circle cx="50" cy="60" r="8" fill="#6bc96f"/>
  <circle cx="78" cy="60" r="8" fill="#6bc96f"/>
  <ellipse cx="64" cy="50" rx="20" ry="15" fill="#5dbb63"/>
  
  <!-- Глаза -->
  <circle cx="55" cy="48" r="5" fill="white"/>
  <circle cx="73" cy="48" r="5" fill="white"/>
  <circle cx="57" cy="50" r="2.5" fill="#1a1a2e"/>
  <circle cx="75" cy="50" r="2.5" fill="#1a1a2e"/>
  
  <!-- Крылья -->
  <path d="M35 65 Q20 50 25 35 Q40 45 45 60" fill="#4a9c59"/>
  <path d="M93 65 Q108 50 103 35 Q88 45 83 60" fill="#4a9c59"/>
  
  <!-- Кофейное зерно -->
  <ellipse cx="64" cy="85" rx="12" ry="8" fill="#8B4513" transform="rotate(-45 64 85)"/>
  <path d="M58 85 Q64 79 70 85" stroke="#CD853F" stroke-width="2" fill="none"/>
  
  <!-- Блеск -->
  <circle cx="48" cy="45" r="3" fill="white" opacity="0.6"/>
</svg>
